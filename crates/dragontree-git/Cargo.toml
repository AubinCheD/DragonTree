[package]
name = "dragontree-git"
description = "Moteur git de DragonTree : exécution de git.exe, parseurs, graphe, découverte de dépôts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dragontree-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
ignore.workspace = true
smallvec.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
