[package]
name = "dragontree-app"
description = "DragonTree — client git graphique natif écrit en Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "dragontree_app"
path = "src/lib.rs"

[[bin]]
name = "dragontree"
path = "src/main.rs"

[dependencies]
dragontree-i18n.workspace = true
dragontree-git.workspace = true
dragontree-forges.workspace = true
eframe.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
chrono.workspace = true
dirs.workspace = true
rfd.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
syntect.workspace = true
image.workspace = true
regex.workspace = true
suite-accounts.workspace = true
suite-titlebar.workspace = true

[dev-dependencies]
tempfile.workspace = true
egui_kittest = { version = "0.37", features = ["eframe"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
