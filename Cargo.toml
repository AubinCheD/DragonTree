[workspace]
resolver = "3"
members = ["crates/dragontree-i18n", "crates/dragontree-git", "crates/dragontree-forges", "crates/dragontree-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["DragonTree"]

[workspace.dependencies]
dragontree-i18n = { path = "crates/dragontree-i18n" }
dragontree-git = { path = "crates/dragontree-git" }
dragontree-forges = { path = "crates/dragontree-forges" }

# UI — rendu glow uniquement (wgpu mesuré à ~450 Mo privés contre ~45 Mo pour glow)
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "clipboard",
    "links",
    "persistence",
] }
egui = "0.37"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
smallvec = "1"
similar = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
rfd = "0.17"
notify = "8"
notify-debouncer-mini = "0.7"
keyring = "4"
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }
base64 = "0.23"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
tempfile = "3"
regex = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
